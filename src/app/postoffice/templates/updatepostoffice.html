<div class="post-office-page">

    <div class="post-office-header">
        <div class="logo">📮</div>

        <div>
            <h1>Update Post Office</h1>
            <p>Update the details of this post office</p>
        </div>
    </div>

    <div class="form-card">

        <form [formGroup]="updateForm" (ngSubmit)="updatePostOffice()">

            <div class="form-group">
                <label for="city">City</label>
                <input
                    id="city"
                    type="text"
                    formControlName="city"
                    placeholder="Enter city">
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input
                    id="state"
                    type="text"
                    formControlName="state"
                    placeholder="Enter state">
            </div>

            <div class="form-actions">
                <button
                    type="submit"
                    [disabled]="updateForm.invalid">
                    Update Post Office
                </button>
            </div>

        </form>

    </div>

</div>
